<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <meta name="description" content="A premium Pomodoro timer web app">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-container">
        <h1 class="app-title">Focus</h1>
        
        <div class="timer-container">
            <svg class="progress-ring" width="300" height="300">
                <circle class="progress-ring__background" stroke="rgba(255, 255, 255, 0.05)" stroke-width="8" fill="transparent" r="140" cx="150" cy="150"/>
                <circle class="progress-ring__circle" stroke="#ff4d4d" stroke-width="8" fill="transparent" r="140" cx="150" cy="150"/>
            </svg>
            <div class="timer-display" id="time">25:00</div>
        </div>

        <div class="controls">
            <button id="start" class="btn btn-primary">Start</button>
            <button id="pause" class="btn btn-secondary">Pause</button>
            <button id="reset" class="btn btn-secondary">Reset</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
